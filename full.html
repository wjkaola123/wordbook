<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordbook</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Full-tab layout: the same entries the popup shows, arranged in a
       card grid across the page instead of one scrollable column. Card
       chrome lives here — the shared sheet styles entries as a continuous
       dictionary page with divider lines, which a grid can't use. */
    body {
      width: auto;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 28px 56px;
    }

    /* Use the body's gutters for every section so their edges line up. */
    header {
      padding-inline: 0;
    }

    .add-word-form {
      margin-inline: 0;
    }

    #search {
      width: 100%;
      margin: 2px 0 4px;
    }

    #list {
      max-height: none;
      overflow: visible;
      padding: 2px 0 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      /* items stretch to the row's tallest card, so every row reads as
         an even band of cards */
    }

    /* The shared .item + .item divider paints the same border-top this
       draws on every side, so it needs no separate override */
    .item {
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 13px;
      display: flex;
      flex-direction: column;
    }

    /* Pin the date to the card foot so a short card's stretch space sits
       between example and date, not as a hole below the card edge */
    .item .meta {
      margin-top: auto;
      padding-top: 2px; /* keep the shared list margin gap when there's no slack */
    }

    /* The flashcard keeps its own tight word→phonetic spacing (face gap 4px);
       the list's rhythm widening above is for the entry cards only */
    .flash-word-row .phonetic {
      margin-top: 0;
    }

    /* Full-width banners, not one grid cell wide */
    .sync-error,
    .empty {
      grid-column: 1 / -1;
    }

    /* Reading mode: one card at a time, flipped in place like a physical
       flashcard. #list stays in the DOM (popup.js keeps rendering it while
       hidden); this section just replaces it visually. */

    /* The display rules on this page beat the UA's [hidden] default, so
       hiding needs its own override to take effect. .flash-phonetic rides
       on the shared .phonetic's display:block; .flash-pos is a flex
       item like the others here. */
    #list[hidden],
    #reader[hidden],
    .flash-nav[hidden],
    .flash-phonetic[hidden],
    .flash-pos[hidden] {
      display: none;
    }

    #reader {
      max-width: 620px;
      margin: 26px auto 0;
    }

    /* No overflow/filter/contain here — they flatten preserve-3d. The card
       background lives on the faces so the deck-edge pseudos below stay
       visible behind them. */
    .flashcard {
      position: relative;
      perspective: 1200px;
      cursor: pointer;
      min-height: 260px;
      /* No focus ring: the flip itself is the keyboard feedback */
      outline: none;
    }

    /* Grid-stacked faces: the card grows to the taller face, and both
       faces stretch to equal height so the back always covers the front */
    .flash-inner {
      display: grid;
      transform-style: preserve-3d;
      min-height: inherit;
    }

    @media (prefers-reduced-motion: no-preference) {
      .flash-inner {
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
    }

    .flash-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 30px 34px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 14px;
    }

    .flash-front {
      align-items: center;
      text-align: center;
    }

    .flash-back {
      transform: rotateY(180deg);
    }

    .flashcard.flipped .flash-inner {
      transform: rotateY(180deg);
    }

    /* The phonetic sits under the word, matching the grid cards */
    .flash-word-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .flash-word {
      font: 700 34px/1.25 var(--serif);
      word-break: break-word;
    }

    .flash-pos {
      flex: none;
      font-size: 14px;
    }

    /* The shared .phonetic at card scale */
    .flash-phonetic {
      font-size: 15px;
    }

    /* POS leads the meaning on the back, mirroring the grid card */
    .flash-meaning-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .flash-meaning {
      font: 400 18px/1.5 var(--serif);
    }

    /* pre-line: AI examples are a sentence + translation pair joined by \n;
       flex:1 inside the row keeps the speak button at the right edge */
    .flash-example {
      flex: 1;
      font: italic 14px/1.6 var(--serif);
      color: var(--soft-ink);
      white-space: pre-line;
    }

    /* The example's read-aloud button rides the text's top-right edge,
       mirroring the grid card's example row. The [hidden] override is
       load-bearing like the one above — .speak's own display rule beats
       the UA's [hidden] default */
    .flash-example-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .flash-example-row .speak[hidden] {
      display: none;
    }

    /* The shared hover reveal for .speak is scoped to .item; re-scope it
       to the flashcard, and centre the group on the front face (the shared
       rule aligns it to the flex-start edge) */
    .flashcard:hover .speak,
    #reader .speak:focus-visible {
      opacity: 1;
    }

    #reader .speak-group {
      align-self: center;
      margin-top: 6px;
    }

    .flash-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .flash-btn {
      border: 1px solid var(--hairline);
      background: var(--paper);
      color: var(--soft-ink);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font: 500 13px var(--sans);
    }

    .flash-btn:hover {
      background: var(--hover);
    }

    .flash-progress {
      font-size: 11.5px;
      color: var(--muted);
    }

    /* Edges of the remaining deck peeking below the card — painted behind
       the (transformed) faces by tree order, no z-index needed */
    .flashcard::before,
    .flashcard::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: 100%;
      height: 7px;
      background: var(--fill);
      border: 1px solid var(--hairline);
      border-radius: 0 0 12px 12px;
    }

    .flashcard::before {
      margin-top: 3px;
    }

    .flashcard::after {
      margin-top: 9px;
      left: 22px;
      right: 22px;
      height: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="mark">Wordbook</span></h1>
    <button id="mode" aria-label="Reading mode" title="Reading mode" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.75" y="2.75" width="7.5" height="7.5" rx="1.25" />
        <path d="M6 12.5h5.25a1.5 1.5 0 0 0 1.5-1.5V5.75" />
      </svg>
    </button>
    <button id="export" aria-label="Export words as JSON" title="Export words as JSON">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2.75v7.5M4.75 7.5 8 10.75 11.25 7.5M3.25 13.25h9.5" />
      </svg>
    </button>
    <button id="clear" aria-label="Clear all words" title="Clear all words">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.75 4.25h10.5M6.25 4V3.4a.9.9 0 0 1 .9-.9h1.7a.9.9 0 0 1 .9.9v.6M4.25 4.25l.55 8.2a1 1 0 0 0 1 .93h4.4a1 1 0 0 0 1-.93l.55-8.2M6.6 7.25v3.5M9.4 7.25v3.5" />
      </svg>
    </button>
  </header>

  <input id="search" placeholder="Search words, meanings, examples" autofocus />
  <form id="addWordForm" class="add-word-form">
    <div class="add-word-row">
      <input id="newWord" aria-label="New word" placeholder="Enter a new word" required autocomplete="off" aria-describedby="addWordStatus" />
      <button type="submit">Add word</button>
    </div>
    <p id="addWordStatus" role="status" aria-live="polite">Meaning, part of speech, example and phonetic are filled automatically.</p>
  </form>
  <div id="list"></div>

  <section id="reader" hidden aria-label="Reading mode">
    <div id="flashSlot"></div>
    <div class="flash-nav">
      <button class="flash-btn" data-nav="prev" aria-label="Previous word" title="Previous (←)">←</button>
      <span class="flash-progress"></span>
      <button class="flash-btn" data-nav="next" aria-label="Next word" title="Next (→)">→</button>
    </div>
  </section>

  <script src="popup.js"></script>
  <script src="full.js"></script>
</body>
</html>
