<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordbook</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #23201c;
      --soft-ink: #55504a;
      --muted: #8d877d;
      --hairline: #e9e6df;
      --fill: #f6f4f0;
      --hover: #fbfaf7;
      --marker: #ffe9a3;
      --red: #b3261e;
      --red-tint: #fdf1f0;
      --accent: #2f5db3;
      --serif: Georgia, "Iowan Old Style", "Times New Roman", "Songti SC", SimSun, serif;
      --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 380px;
      margin: 0;
      font: 13px/1.55 var(--sans);
      color: var(--ink);
      background: var(--paper);
    }

    header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 14px 14px 10px;
    }

    h1 {
      flex: 1;
      margin: 0;
      font: italic 700 17px/1.2 var(--serif);
      letter-spacing: 0.01em;
    }

    /* Marker swipe behind the wordmark — the one bold moment of the page */
    .mark {
      background: linear-gradient(to top, var(--marker) 36%, transparent 36%);
      padding: 0 3px;
    }

    header button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 12.5px var(--sans);
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    header button:hover {
      background: var(--fill);
      color: var(--soft-ink);
    }

    #clear:hover {
      color: var(--red);
      background: var(--red-tint);
    }

    #search {
      width: calc(100% - 28px);
      margin: 2px 14px 4px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--fill);
      font: inherit;
      color: var(--ink);
    }

    #search::placeholder {
      color: var(--muted);
    }

    #search:focus {
      outline: none;
      background: var(--paper);
      border-color: var(--hairline);
      box-shadow: 0 1px 4px rgba(35, 32, 28, 0.06);
    }

    #list {
      padding: 2px 14px 14px;
      max-height: 480px;
      overflow: auto;
    }

    #list::-webkit-scrollbar {
      width: 8px;
    }

    #list::-webkit-scrollbar-thumb {
      background: var(--hairline);
      border-radius: 4px;
    }

    /* Entries read as a continuous dictionary page, not stacked cards */
    .item {
      padding: 13px 4px 12px;
    }

    .item + .item {
      border-top: 1px solid var(--hairline);
    }

    .item:hover {
      background: var(--hover);
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .word {
      flex: 1;
      font: 700 16.5px/1.3 var(--serif);
      word-break: break-word;
    }

    /* POS set the dictionary way: italic abbreviation */
    .pos-tag {
      font: italic 400 12.5px var(--serif);
      color: var(--muted);
    }

    /* Occurrences shown as a superscript frequency mark, like dictionary bands */
    .freq {
      font: 500 10.5px var(--sans);
      color: var(--muted);
      vertical-align: super;
      margin-left: 2px;
    }

    .delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      opacity: 0.55;
      font-size: 13px;
      line-height: 1;
      padding: 5px 7px;
      border-radius: 6px;
      cursor: pointer;
      align-self: flex-start;
    }

    .item:hover .delete,
    .delete:hover,
    .delete:focus-visible {
      opacity: 1;
    }

    .delete:hover {
      color: var(--red);
      background: var(--red-tint);
    }

    /* Meaning and example read as entry text until hovered or focused */
    .item input,
    .item textarea {
      width: 100%;
      margin-top: 6px;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }

    .item input:hover,
    .item textarea:hover {
      background: var(--fill);
      border-color: var(--hairline);
    }

    .item input:focus,
    .item textarea:focus {
      outline: none;
      background: var(--paper);
      border-color: #b7b1a6;
      box-shadow: 0 1px 4px rgba(35, 32, 28, 0.07);
    }

    .item textarea {
      resize: vertical;
    }

    /* The native resize grip is noisy at popup scale; dragging still works */
    .item textarea::-webkit-resizer {
      display: none;
    }

    .item input[data-field="meaning"] {
      font-family: var(--serif);
      font-size: 14px;
    }

    .item textarea[data-field="example"] {
      font-style: italic;
      font-size: 12.5px;
      color: var(--soft-ink);
    }

    .item input::placeholder,
    .item textarea::placeholder {
      color: #b3ada2;
    }

    .loading {
      color: #8a6d3b;
      font: italic 12.5px var(--serif);
      margin: 6px 0 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .loading {
        animation: pulse 1.2s ease-in-out infinite;
      }
    }

    @keyframes pulse {
      50% { opacity: 0.45; }
    }

    /* Citation line: date + where the word was found */
    .meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 7px;
      font-size: 11.5px;
      color: var(--muted);
    }

    .meta .source {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: #cfccc4;
      text-underline-offset: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta .source:hover {
      color: var(--accent);
      text-decoration-color: currentColor;
    }

    .sync-error {
      color: var(--red);
      background: var(--red-tint);
      border-radius: 8px;
      font-size: 12px;
      padding: 8px 10px;
      margin: 6px 0 4px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      font: italic 13.5px/1.7 var(--serif);
      padding: 44px 12px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="mark">Wordbook</span></h1>
    <button id="export">Export</button>
    <button id="clear">Clear</button>
  </header>

  <input id="search" placeholder="Search words, meanings, examples" autofocus />
  <div id="list"></div>

  <script src="popup.js"></script>
</body>
</html>
