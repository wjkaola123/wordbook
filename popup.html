<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordbook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1><span class="mark">Wordbook</span></h1>
    <button id="openFull" aria-label="Open in full page" title="Open in full page">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.75 3.25H4.5a1.25 1.25 0 0 0-1.25 1.25v6.5a1.25 1.25 0 0 0 1.25 1.25h6.5a1.25 1.25 0 0 0 1.25-1.25V8.75M9.5 3.25h3.25v3.25M12.75 3.25 7.25 8.75" />
      </svg>
    </button>
    <button id="export" aria-label="Export words as JSON" title="Export words as JSON">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2.75v7.5M4.75 7.5 8 10.75 11.25 7.5M3.25 13.25h9.5" />
      </svg>
    </button>
    <button id="clear" aria-label="Clear all words" title="Clear all words">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.75 4.25h10.5M6.25 4V3.4a.9.9 0 0 1 .9-.9h1.7a.9.9 0 0 1 .9.9v.6M4.25 4.25l.55 8.2a1 1 0 0 0 1 .93h4.4a1 1 0 0 0 1-.93l.55-8.2M6.6 7.25v3.5M9.4 7.25v3.5" />
      </svg>
    </button>
  </header>

  <input id="search" placeholder="Search words, meanings, examples" autofocus />
  <form id="addWordForm" class="add-word-form">
    <div class="add-word-row">
      <input id="newWord" aria-label="New word" placeholder="Enter a new word" required autocomplete="off" aria-describedby="addWordStatus" />
      <button type="submit">Add word</button>
    </div>
    <p id="addWordStatus" role="status" aria-live="polite">Meaning, part of speech, example and phonetic are filled automatically.</p>
  </form>
  <div id="list"></div>

  <script src="popup.js"></script>
</body>
</html>
