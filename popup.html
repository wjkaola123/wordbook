<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordbloom</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1><span class="mark">Wordbloom</span></h1>
    <button id="openFull" aria-label="Open in full page" title="Open in full page">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.75 3.25H4.5a1.25 1.25 0 0 0-1.25 1.25v6.5a1.25 1.25 0 0 0 1.25 1.25h6.5a1.25 1.25 0 0 0 1.25-1.25V8.75M9.5 3.25h3.25v3.25M12.75 3.25 7.25 8.75" />
      </svg>
    </button>
    <button id="settings" aria-label="Settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6.5 2 .4 1.5a4.8 4.8 0 0 1 2.2 0L9.5 2l2 .9-.6 1.5a4.8 4.8 0 0 1 1.4 1.7l1.5-.2.5 2.1-1.5.5a4.8 4.8 0 0 1-.5 2.1l1 1.2-1.5 1.6-1.2-.9a4.8 4.8 0 0 1-2.1.6l-.4 1.5H6.4L6 13.1a4.8 4.8 0 0 1-2-.9l-1.3.7-1.2-1.8 1.1-1a4.8 4.8 0 0 1-.1-2.2L1.1 7l.8-2 1.5.4A4.8 4.8 0 0 1 5 3.9L4.6 2.4Z" />
        <circle cx="8" cy="8" r="2" />
      </svg>
    </button>
    <button id="clear" aria-label="Clear all words" title="Clear all words">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.75 4.25h10.5M6.25 4V3.4a.9.9 0 0 1 .9-.9h1.7a.9.9 0 0 1 .9.9v.6M4.25 4.25l.55 8.2a1 1 0 0 0 1 .93h4.4a1 1 0 0 0 1-.93l.55-8.2M6.6 7.25v3.5M9.4 7.25v3.5" />
      </svg>
    </button>
  </header>

  <input id="search" placeholder="Search words, meanings, examples" autofocus />
  <form id="addWordForm" class="add-word-form">
    <div class="add-word-row">
      <div class="new-word-input">
        <input id="newWord" aria-label="New word" placeholder="Enter a new word" required autocomplete="off" aria-describedby="addWordStatus" />
        <button id="voiceInput" type="button" aria-label="Start voice input" title="Start voice input" aria-pressed="false">
          <svg class="voice-mic" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="6" y="1.5" width="4" height="8" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5"/></svg>
          <svg class="voice-stop" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
        </button>
      </div>
      <button type="submit" aria-label="Save word" title="Save word">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 2h8l3 3v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z" />
          <path d="M5 2v4h6V2M5 14V9h6v5" />
        </svg>
      </button>
    </div>
    <p id="addWordStatus" role="status" aria-live="polite"></p>
  </form>
  <div id="list"></div>

  <script src="popup.js"></script>
  <script src="voice-input.js"></script>
</body>
</html>
